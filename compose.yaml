name: perjadin-backend

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    extra_hosts:
      - "ims-db-tunnel:172.25.0.1"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  perjadin_mysql_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.25.0.0/16
