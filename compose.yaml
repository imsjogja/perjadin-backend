name: ${COMPOSE_PROJECT_NAME:-perjadin-backend}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    extra_hosts:
      - "ims-db-tunnel:${IMS_DB_TUNNEL_GATEWAY:-172.25.0.1}"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PERJADIN_BACKEND_PORT:-8000}:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  perjadin_mysql_data:

networks:
  default:
    ipam:
      config:
        - subnet: ${PERJADIN_DOCKER_SUBNET:-172.25.0.0/16}
