name: perjadin-backend

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    extra_hosts:
      - "ims-db-tunnel:172.25.0.1"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    env_file:
      - .env.local
    ports:
      - "33068:3306"
    volumes:
      - perjadin_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  perjadin_mysql_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.25.0.0/16
